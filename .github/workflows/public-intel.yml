# Schedule acceptance, not the weekly job yet.
# Clock checked 2026-11-22 12:38 Asia/Shanghai: 10:30 that day had already passed.
# Next three 10:30 Asia/Shanghai slots are 2026-11-23, 2026-11-24, 2026-11-25.
# workflow_dispatch does not count as one of those three.
# After the third successful schedule run, record_schedule_run.py replaces
# SCHEDULE_MODE acceptance with Sunday 10:30 Asia/Shanghai.
#
# GitHub docs checked 2026-11-22:
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
# - cron defaults to UTC; optional IANA timezone field is supported
# - github.event.schedule is the cron string, not a timestamp
# - schedules run only from the default branch and can be delayed or dropped
# - public schedules disable after 60 days without repository activity
# Minute 30 avoids the documented top-of-hour load spike. 10:30 is inside 10:00-20:00 Asia/Shanghai.
name: public-intel-collect
on:
  workflow_dispatch:
  schedule:
    # SCHEDULE_MODE: acceptance
    - cron: "30 10 23,24,25 11 *"
      timezone: "Asia/Shanghai"
concurrency:
  group: public-intel-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve planned timestamp
        id: plan
        run: |
          python collector/planned_time.py \
            --event-name "${{ github.event_name }}" \
            --schedule "${{ github.event.schedule }}" \
            --timezone Asia/Shanghai
      - name: Run collectors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          TRIGGER="${{ github.event_name }}"
          PLANNED="${{ steps.plan.outputs.planned_at }}"
          RUN_ID="gha_${GITHUB_RUN_ID}_${TRIGGER}"
          python collector/collect_public_intel.py \
            --out data \
            --run-id "${RUN_ID}_ai" \
            --planned-at "${PLANNED}" \
            --trigger "${TRIGGER}" \
            --cost-usd 0
          e1=$?
          python collector/collect_longtail.py \
            --out data \
            --run-id "${RUN_ID}_longtail" \
            --planned-at "${PLANNED}" \
            --trigger "${TRIGGER}" \
            --cost-usd 0
          e2=$?
          python collector/collect_github_releases.py \
            --out data \
            --run-id "${RUN_ID}_ghrel" \
            --planned-at "${PLANNED}" \
            --trigger "${TRIGGER}" \
            --cost-usd 0
          e3=$?
          python collector/collect_builder_feeds.py \
            --out data \
            --run-id "${RUN_ID}_feeds" \
            --planned-at "${PLANNED}" \
            --trigger "${TRIGGER}" \
            --cost-usd 0
          e4=$?
          echo "exit_ai=$e1 exit_longtail=$e2 exit_ghrel=$e3 exit_feeds=$e4" | tee data/last_exit.txt
          if [ "$e1" -ne 0 ] || [ "$e2" -ne 0 ] || [ "$e3" -ne 0 ] || [ "$e4" -ne 0 ]; then
            echo "one_or_more_collectors_failed" > data/last_status.txt
          else
            echo "ok" > data/last_status.txt
          fi
          exit 0
      - name: Record schedule acceptance
        run: |
          python collector/record_schedule_run.py \
            --out data \
            --trigger "${{ github.event_name }}" \
            --planned-at "${{ steps.plan.outputs.planned_at }}" \
            --status "$(tr -d '\n' < data/last_status.txt)" \
            --run-id "gha_${GITHUB_RUN_ID}_${{ github.event_name }}" \
            --github-run-id "${GITHUB_RUN_ID}" \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --workflow .github/workflows/public-intel.yml
      - name: Secret scan before commit
        run: |
          python collector/secret_scan.py --root .
      - name: Commit public results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data .github/workflows/public-intel.yml
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "collect ${GITHUB_RUN_ID} ${{ github.event_name }}"
            git push origin HEAD:main
          fi
      - name: Fail run if a collector failed
        run: |
          if [ -f data/last_status.txt ] && grep -qx ok data/last_status.txt; then
            echo "collectors ok"
          else
            echo "collector failure recorded in data/; marking workflow failed"
            cat data/last_exit.txt || true
            exit 1
          fi
